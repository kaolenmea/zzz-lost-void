name: Release

# 推送 v* 标签（如 v1.0.0）时打包免安装包并发布到 GitHub Release。
# 模型文件不在 git 里：需要先在本仓库建一个叫 `models` 的 Release，
# 把 assets/models 整个目录压成 models.zip 传上去（见 docs/develop/setup/release.md）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download models
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models --pattern models.zip --dir $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force assets/models | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/models.zip" -DestinationPath assets/models -Force

      - name: Build package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ('${{ github.ref_type }}' -ne 'tag') { $version = (uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim() }
          ./packaging/build.ps1 -Version $version

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ZZZLostVoid
          path: dist/ZZZLostVoid-v*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 优先用 release_notes/<标签>.md（中英文更新说明），没有才自动生成
          $notes = '--generate-notes'
          $notesFile = 'release_notes/${{ github.ref_name }}.md'
          if (Test-Path $notesFile) { $notes = "--notes-file=$notesFile" }
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist/ZZZLostVoid-v*.zip).FullName `
            --title '${{ github.ref_name }}' $notes
