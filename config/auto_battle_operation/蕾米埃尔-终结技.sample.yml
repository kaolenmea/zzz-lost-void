# 终结技演出期间无敌 保护盖住演出约 4 秒 放完清掉
operations:
  - op_name: "设置状态"
    state_list: ["自定义-动作不打断", "自定义-无视闪光"]
    seconds: 4
  - op_name: "设置状态"
    state: "自定义-失衡时间"
    seconds_add: -3.8
  - op_name: "按键-终结技"
    post_delay: 0.1
    repeat: 40
  - op_name: "清除状态"
    state_list: ["自定义-动作不打断", "自定义-无视闪光"]
