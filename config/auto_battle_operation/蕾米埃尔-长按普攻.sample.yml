  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-按下"
  - op_name: "等待秒数"
    seconds: 0.5
  - op_name: "按键-普通攻击-松开"
  - op_name: "清除状态"
    state: "自定义-动作不打断"
  - op_name: "等待秒数"
    seconds: 0.3
