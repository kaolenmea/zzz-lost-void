# # 基础信息 # #
author: "Kaolenmea"
thanks: "B站 BV1ZZGg64EiK 世一简教学 简维丹逐帧流程讲解"
homepage: ""
version: "1.0"
team_list:
  - ["蕾米埃尔", "维琳娜", "简"]

introduction: "简、维琳娜、蕾米埃尔专属配队，按「全01简维丹」教程的轴来打；蕾米埃尔按 2 影写，每次入场先打一个重击（长按普攻）"

# 和【全配队通用】的区别：
# 闪避、连携、快速支援、掉血保命沿用通用模板；
# 站场出招和切人改由下面三个专属模板决定，不走通用的合轴 / 紧急切人模板，避免通用规则打乱这套轴。
# - 简维丹-简：简专续杯、能量 3/4 交强特、萨霍夫跳、什么时候切队友
# - 简维丹-维琳娜：跟简的强特合轴、风暴眼封场、放完回简
# - 简维丹-蕾米埃尔：入场重击、虚曜满长按普攻、浮晖满起飞后交给简

check_dodge_interval: 0.02 # 闪避识别间隔
check_agent_interval: 0.1 # 代理人识别间隔
check_chain_interval: 0.02 # 连携识别间隔
check_quick_interval: 0.2 # 快速支援识别间隔
auto_lock_interval: -1 # 锁定间隔，不锁定
auto_turn_interval: 2 # 镜头转向间隔

# 目标检测相关
target_lock_interval: 1.0 # 目标锁定检测间隔
abnormal_status_interval: 0 # 目标异常状态检测，代表不检测

scenes:
  - triggers: ["格挡-破碎"]
    priority: 98
    interval: 0.3
    handlers:
      - states: "[闪避识别-黄光, 0, 2]"
        debug_name: "画面黑白无法支援"
        operations:
          - op_name: "清除状态"
            state_list: ["自定义-动作不打断", "自定义-黄光切人"]
          - op_name: "等待秒数"
            seconds: 0.1

  - triggers: ["闪避识别-黄光", "闪避识别-红光", "闪避识别-声音"]
    priority: 97
    interval: 0.3
    handlers:
      - states: "![自定义-无视闪光, -15, 0]"
        sub_handlers:
          - states: "[闪避识别-黄光, 0, 0.3]"
            sub_handlers:
              - state_template: "支援攻击模板-特殊情况"
              - state_template: "双反模板-击破"
              - state_template: "双反模板-命破"
              - state_template: "双反模板-异常"
              - state_template: "双反模板-防护"
              - state_template: "双反模板-下一个"
          - states: "![自定义-动作不打断, -10, -0.1] & ([闪避识别-红光, 0, 0.3] | [闪避识别-声音, 0, 0.3])"
            sub_handlers:
              - state_template: "闪A模板-全角色"

  - triggers: ["按键可用-连携技"]
    priority: 98
    interval: 1.5
    handlers:
      - states: ""
        sub_handlers:
          - state_template: "连携模板-通用"

  - triggers: ["连携技-准备"]
    priority: 97
    interval: 1
    handlers:
      - states: "[连携技-准备]"
        debug_name: "连携技马上要来了"
        operations:
          - op_name: "等待秒数"
            seconds: 0.1

  - triggers: ["按键可用-快速支援"]
    priority: 97
    interval: 0.1
    handlers:
      - state_template: "快速支援模板-全角色"

  - triggers: ["前台-血量扣减"]
    priority: 90
    handlers:
      - states: "[前台-血量扣减]{1, 100} & ![自定义-动作不打断, 0, 30]"
        sub_handlers:
          - state_template: "轮换-救命-全角色"
          - state_template: "闪A模板-全角色"

  - triggers: ["按键可用-切换后援"]
    priority: 70
    interval: 0.1
    handlers:
      - states: "![自定义-无视闪光, -15, 0]"
        debug_name: "切换后援可用"
        operations:
          - op_name: "按键-切换后援-按下"
          - op_name: "等待秒数"
            seconds: 0.1
          - op_name: "按键-切换后援-松开"
          - op_name: "等待秒数"
            seconds: 0.1

  - triggers: []
    priority: 9
    interval: 0.02
    handlers:
      # 刚开始未识别到角色时候不要乱切
      - states: "![自定义-动作不打断, -10, -0.1] & ![自定义-无视闪光, -15, 0]"
        interrupt_states: "![前台-异常] & [前台-能量, 0, 0.1]"
        sub_handlers:
          - state_template: "自动锁定模板"
          # 蕾米埃尔离场后清掉入场标记，下次入场重新先打重击
          - states: "![前台-蕾米埃尔] & ([自定义-蕾米埃尔-已重击, 0, 9999] | [自定义-蕾米埃尔-起飞, 0, 9999])"
            debug_name: "蕾米埃尔离场"
            operations:
              - op_name: "清除状态"
                state_list: ["自定义-蕾米埃尔-已重击", "自定义-蕾米埃尔-起飞"]
          # 切人之后先松开按键，否则闪避打断长按后按键可能一直没松开
          - states: "([按键-切换角色-下一个, 0, 0.1] | [按键-切换角色-上一个, 0, 0.1]) | [自定义-连携跳过, 0, 0.1]"
            debug_name: "切人后松开按键"
            operations:
              - op_name: "清除状态"
                state_list: ["自定义-合轴时间", "自定义-动作不打断"]
              - op_name: "按键-普通攻击-松开"
              - op_name: "按键-特殊攻击-松开"
              - op_name: "按键-移动-前-松开"
              - op_name: "按键-移动-后-松开"
              - op_name: "按键-移动-左-松开"
              - op_name: "按键-移动-右-松开"
              - op_name: "按键-闪避-松开"
              - op_name: "等待秒数"
                seconds: 0.1
          - state_template: "简维丹-简"
          - state_template: "简维丹-维琳娜"
          - state_template: "简维丹-蕾米埃尔"
