template_name: "简维丹-维琳娜"
# 简维丹配队里维琳娜在前台时的出招：她只负责补强化特殊技和封场，不站场
# - 简交完强特切过来：补一个强化特殊技（扬清），然后切蕾米埃尔
# - 风华 >= 90：长按放风暴眼（封场），放完游戏会给出快速支援回简
# - 其他情况回简
handlers:
  - states: "[前台-维琳娜]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-维琳娜]"
    sub_handlers:
      - states: "[自定义-终结技被强制释放, 0, 1]"
        operations:
          - operation_template: "维琳娜-终结技"

      - states: "[自定义-红光闪避, 0, 1]"
        sub_handlers:
          - states: "[维琳娜-特殊技可用]"
            debug_name: "红光特殊技"
            operations:
              - operation_template: "维琳娜-特殊攻击"
          - states: ""
            debug_name: "红光闪A"
            operations:
              - operation_template: "维琳娜-闪A"

      - states: "[自定义-黄光切人, 0, 1]"
        operations:
          - operation_template: "维琳娜-支援攻击"

      - states: "[自定义-连携换人, 0, 0.5]"
        operations:
          - operation_template: "维琳娜-连携攻击"

      - states: "([按键-切换角色-下一个, 0, 0.3] | [按键-切换角色-上一个, 0, 0.3])"
        debug_name: "切人后等待"
        operations:
          - op_name: "等待秒数"
            seconds: 0.3

      - states: "[按键可用-快速支援]"
        debug_name: "封场后快支回简"
        operations:
          - op_name: "按键-快速支援"
          - op_name: "等待秒数"
            seconds: 0.1

      - states: "[自定义-维琳娜-强特合轴, 0, 3] & [维琳娜-特殊技可用]"
        debug_name: "跟简的强特合轴"
        operations:
          - op_name: "清除状态"
            state: "自定义-维琳娜-强特合轴"
          - operation_template: "维琳娜-强化特殊技"
          - op_name: "设置状态"
            state: "自定义-维琳娜-扬清"

      - states: "[自定义-维琳娜-扬清, 0, 3] & ![自定义-蕾米埃尔-上次起飞, 0, 5] & ([蕾米埃尔-虚曜]{3,3} | [蕾米埃尔-浮晖]{100,100})"
        debug_name: "强特后切蕾米埃尔"
        operations:
          - op_name: "清除状态"
            state: "自定义-维琳娜-扬清"
          - op_name: "按键-切换角色"
            agent_name: "蕾米埃尔"

      - states: "[维琳娜-风华]{90, 135}"
        interrupt_states: "[按键可用-快速支援]"
        debug_name: "风暴眼封场"
        operations:
          - op_name: "设置状态"
            state: "自定义-维琳娜-风暴眼"
          - operation_template: "维琳娜-长按普攻"

      - states: "[维琳娜-终结技可用]"
        interrupt_states: "[按键可用-快速支援]"
        debug_name: "终结技"
        operations:
          - operation_template: "维琳娜-终结技"

      # 能量多就用强化特殊技攒风华，攒够了下一轮直接封场
      - states: "[维琳娜-特殊技可用] & [维琳娜-能量]{90, 120}"
        debug_name: "多余能量放强化特殊技"
        operations:
          - operation_template: "维琳娜-强化特殊技"

      - states: ""
        debug_name: "回简"
        operations:
          - op_name: "按键-切换角色"
            agent_name: "简"
          - op_name: "等待秒数"
            seconds: 0.3
