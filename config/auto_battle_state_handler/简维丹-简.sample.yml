template_name: "简维丹-简"
# 简维丹配队里简在前台时的出招，按教程「全01简维丹」整理：
# - 简专：闪A / 强化特殊技 / 快支入场都会续上，持续 10 秒；掉了要连续三次闪A 补回来
# - 能量到 3/4（90）或物理积蓄快满（70）交强化特殊技打爆物理条，交完先切维琳娜补一个强化特殊技，再由维琳娜切蕾米埃尔
# - BOSS 战大招留到失衡中放；「强敌-失衡值」「强敌-失衡中」「目标-异常积蓄-物理」由画面识别，只在看得到 BOSS 条、头顶圆标时更新
# - 蕾米埃尔虚曜满或浮晖满（头像下的飞行能量条亮起）就切她进场
# - 维琳娜风华够放风暴眼（封场）时切她，放完会快支回简
# 「自定义-简-简专」记录最近一次续简专的时间
handlers:
  - states: "[前台-简]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-简]"
    sub_handlers:
      - states: "[自定义-终结技被强制释放, 0, 1]"
        operations:
          - operation_template: "简-终结技"

      - states: "[自定义-黄光切人, 0, 1]"
        operations:
          - operation_template: "简-格挡攻击"

      - states: "[自定义-红光闪避, 0, 1]"
        sub_handlers:
          - states: "[自定义-简-萨霍夫跳合轴, -3, 0]"
            debug_name: "萨霍夫跳中松开普攻"
            operations:
              - op_name: "按键-普通攻击-松开"
          - states: ""
            debug_name: "闪反"
            operations:
              - op_name: "设置状态"
                state: "自定义-简-简专"
              - operation_template: "简-闪A"

      - states: "[自定义-连携换人, 0, 0.5]"
        operations:
          - operation_template: "简-连携攻击"

      - states: "([按键-切换角色-下一个, 0, 0.1] | [按键-切换角色-上一个, 0, 0.1])"
        debug_name: "切人后等待"
        operations:
          - op_name: "等待秒数"
            seconds: 0.1

      - states: "[自定义-快速支援换人, 0, 1.5] & ![自定义-简-简专, 0, 1.5]"
        debug_name: "快支入场续简专"
        operations:
          - op_name: "设置状态"
            state: "自定义-简-简专"

      # 失衡中，或维琳娜刚封场、简快支进来打爆物理条后开大；BOSS 失衡快满时留着等失衡
      - states: "[简-终结技可用] & ([强敌-失衡中, 0, 1] | [自定义-失衡时间, 0, 10] | ([自定义-维琳娜-风暴眼, 1, 8] & ![强敌-失衡值, 0, 1]{75, 100}))"
        debug_name: "终结技"
        operations:
          - op_name: "按键-普通攻击-松开"
          - operation_template: "简-终结技"

      - states: "![自定义-简-简专, 0, 10]"
        debug_name: "掉专：三次闪A补回"
        operations:
          - op_name: "按键-普通攻击-松开"
          - op_name: "设置状态"
            state: "自定义-简-简专"
          - operation_template: "简-闪A"
          - operation_template: "简-闪A"
          - operation_template: "简-闪A"
          - op_name: "设置状态"
            state: "自定义-简-简专"

      - states: "![自定义-简-简专, 0, 8]"
        debug_name: "简专快到期：闪A续上"
        operations:
          - op_name: "按键-普通攻击-松开"
          - op_name: "设置状态"
            state: "自定义-简-简专"
          - operation_template: "简-闪A"

      - states: "[简-特殊技可用] & ([简-能量]{90, 120} | [目标-异常积蓄-物理, 0, 1]{70, 100})"
        debug_name: "交强化特殊技打爆物理条"
        operations:
          - op_name: "按键-普通攻击-松开"
          - operation_template: "简-强化特殊攻击"
          - op_name: "设置状态"
            state_list: ["自定义-简-简专", "自定义-简-强特"]

      # 交完强特，先切维琳娜补一个强化特殊技，再由她切蕾米埃尔
      - states: "[自定义-简-强特, 0, 1.5] & [维琳娜-特殊技可用]"
        debug_name: "强特后切维琳娜合轴"
        operations:
          - op_name: "设置状态"
            state: "自定义-维琳娜-强特合轴"
          - op_name: "按键-切换角色"
            agent_name: "维琳娜"

      - states: "![自定义-蕾米埃尔-上次起飞, 0, 5] & ([蕾米埃尔-虚曜]{3,3} | [蕾米埃尔-浮晖]{100,100})"
        debug_name: "蕾米埃尔就绪切入"
        operations:
          - op_name: "按键-普通攻击-松开"
          - op_name: "按键-切换角色"
            agent_name: "蕾米埃尔"

      - states: "[维琳娜-风华]{90, 135} & ![自定义-维琳娜-风暴眼, 0, 8]"
        debug_name: "切维琳娜封场"
        operations:
          - op_name: "按键-普通攻击-松开"
          - op_name: "按键-切换角色"
            agent_name: "维琳娜"

      # 萨霍夫跳过程中能量到 3/4、物理积蓄快满或蕾米埃尔就绪就停跳
      - states: "[简-萨霍夫跳]"
        interrupt_states: "([简-特殊技可用] & ([简-能量]{90, 120} | [目标-异常积蓄-物理, 0, 1]{70, 100})) | (![自定义-蕾米埃尔-上次起飞, 0, 5] & ([蕾米埃尔-虚曜]{3,3} | [蕾米埃尔-浮晖]{100,100}))"
        debug_name: "萨霍夫跳"
        operations:
          - operation_template: "简-萨霍夫跳"

      - states: ""
        debug_name: "普通攻击"
        operations:
          - operation_template: "简-普通攻击"
