template_name: "简维丹-蕾米埃尔"
# 简维丹配队里蕾米埃尔在前台时的出招，按 2 影 1 精写：
# 入场先重击 -> 虚曜满长按普攻 -> 浮晖满长按强化特殊技起飞 -> 交给简
# 「自定义-蕾米埃尔-已重击」「自定义-蕾米埃尔-起飞」在她离场时由主线程清除，所以每次入场（含开局、连携入场）都会先重击一次
# 「自定义-蕾米埃尔-上次起飞」不清除，给队友判断「刚起飞别马上切回她」用
handlers:
  - states: "[前台-蕾米埃尔]"
    interrupt_states: "[前台-能量, 0, 0.1] & ![前台-蕾米埃尔]"
    sub_handlers:
      - states: "[自定义-终结技被强制释放, 0, 1]"
        operations:
          - operation_template: "蕾米埃尔-终结技"

      - states: "[自定义-黄光切人, 0, 1]"
        operations:
          - operation_template: "通用-支援攻击"

      - states: "[自定义-红光闪避, 0, 1]"
        operations:
          - operation_template: "通用-闪A"

      - states: "[自定义-连携换人, 0, 0.5]"
        operations:
          - operation_template: "蕾米埃尔-连携攻击"

      - states: "([按键-切换角色-下一个, 0, 0.3] | [按键-切换角色-上一个, 0, 0.3])"
        debug_name: "切人后等待"
        operations:
          - op_name: "等待秒数"
            seconds: 0.1

      - states: "![自定义-蕾米埃尔-已重击, 0, 9999]"
        debug_name: "入场重击"
        operations:
          - op_name: "设置状态"
            state: "自定义-蕾米埃尔-已重击"
          - operation_template: "蕾米埃尔-入场重击"

      # 起飞后屏幕变亮会出现快速支援，按住强化特殊技的同时切出去
      - states: "[按键可用-快速支援]"
        debug_name: "起飞后快速支援"
        operations:
          - op_name: "设置状态"
            state_list: ["自定义-动作不打断", "自定义-无视闪光"]
            seconds: 0.05
          - op_name: "按键-快速支援"
          - op_name: "清除状态"
            state_list: ["自定义-动作不打断", "自定义-无视闪光"]

      # 起飞后没等到快速支援，直接切简
      - states: "[自定义-蕾米埃尔-起飞, 0, 8]"
        debug_name: "起飞后切简"
        operations:
          - op_name: "按键-特殊攻击-松开"
          - op_name: "按键-切换角色"
            agent_name: "简"

      - states: "[蕾米埃尔-终结技可用]"
        debug_name: "终结技"
        operations:
          - operation_template: "蕾米埃尔-终结技"

      - states: "[蕾米埃尔-虚曜]{3,3}"
        interrupt_states: "[蕾米埃尔-虚曜]{0,0} | [按键可用-快速支援]"
        debug_name: "虚曜满长按普攻"
        operations:
          - operation_template: "蕾米埃尔-长按普攻"

      - states: "[蕾米埃尔-浮晖]{100,100}"
        interrupt_states: "[按键可用-快速支援] | [蕾米埃尔-虚曜]{3,3}"
        debug_name: "浮晖满起飞"
        operations:
          - op_name: "设置状态"
            state_list: ["自定义-蕾米埃尔-起飞", "自定义-蕾米埃尔-上次起飞"]
          - operation_template: "蕾米埃尔-长按强化特殊技"

      - states: ""
        interrupt_states: "[蕾米埃尔-虚曜]{3,3} | [蕾米埃尔-浮晖]{100,100} | [按键可用-快速支援]"
        debug_name: "普通攻击攒浮晖"
        operations:
          - operation_template: "蕾米埃尔-普通攻击"
